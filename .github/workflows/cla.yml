# Holds a pull request until its author has agreed to the CLA, and records the
# agreement in a signatures file on the default branch.
#
# `pull_request_target` rather than `pull_request`: storing a signature needs a
# write token, and `pull_request` hands a fork's run a read-only one. That
# trigger is only safe because nothing from the pull request is checked out
# here — the action reads its metadata and the comments on it, never its code.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor licence agreement
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit rather than a tag: a tag can be moved to point at
      # different code, and this step runs with write permissions on every pull
      # request that arrives.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: .github/cla/signatures.json
          # The document itself, not the summary of it in the documentation —
          # what a contributor agrees to should be the authoritative text.
          path-to-document: https://github.com/fapost-lab/core/blob/main/CLA.md
          branch: main
          allowlist: bpartner,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >
            Thanks for the pull request. Before it can be merged we need you to
            agree to the [Contributor Licence Agreement](https://github.com/fapost-lab/core/blob/main/CLA.md).
            It does not transfer ownership — you keep the copyright in what you
            contribute. To agree, comment on this pull request with exactly:
          custom-pr-sign-comment: I have read the CLA document and I hereby sign the CLA
          custom-allsigned-prcomment: Every contributor to this pull request has signed the CLA.
